name: build FVList Data

# 외부 저장소로부터 호출
on:
  workflow_call:

permissions:
  contents: write
  pages: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    env:
      FV_SOURCE: vrchat/ProjectFV/BaseFile/FVBase.csv
      FV_CURRENT: vrchat/ProjectFV/ImageLoading/FVList.json
      FV_USER_AGENT: ProjectFV/1.0 (https://github.com/${{ github.repository }})

    steps:
      # 작업 루트는 호출한 데이터 저장소
      - name: 데이터 저장소의 최신 원본 가져오기
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository }}
          ref: main
          fetch-depth: 0

      # 워커 코드는 별도 폴더에 배치
      - name: 워커 코드 가져오기
        uses: actions/checkout@v4
        with:
          repository: Vrcticfox/FVListWorker
          ref: main
          path: .fv-worker
          persist-credentials: false

      - name: Python 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: .fv-worker/requirements.txt

      - name: 이미지 라이브러리 설치
        run: python -m pip install -r .fv-worker/requirements.txt

      - name: 오프라인 검증
        run: python -m unittest discover -s .fv-worker/tests -v

      - name: FVList 및 비활성 뱅크 생성
        run: >-
          python .fv-worker/scripts/build_fvlist.py
          --source "$FV_SOURCE"
          --current "$FV_CURRENT"
          --output build/staged

      - name: 생성 결과 보관
        uses: actions/upload-artifact@v4
        with:
          name: fvlist-candidate
          path: build/staged/
          if-no-files-found: error
          retention-days: 7

      - name: 이미지 선배포 및 JSON 전환
        env:
          GH_TOKEN: ${{ github.token }}
        run: python .fv-worker/scripts/publish_fvlist.py